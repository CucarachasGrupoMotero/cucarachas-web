<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cucarachas - Grupo motero independiente de Sevilla">
  <title>Cucarachas — Grupo Motero</title>
  
  <!-- Carga de fuentes desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
  
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --text: #ffffff;
      --muted: #c7c7c7;
      --line: #292929;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    /* Forzamos Metal Mania en todo el cuerpo y elementos */
    body {
      font-family: 'Metal Mania', cursive, sans-serif !important;
      letter-spacing: 1.5px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 19px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 34px 22px 44px;
    }

    .hero {
      text-align: center;
      padding: 6px 0 28px;
    }

    .hero img {
      display: block;
      width: min(100%, 640px);
      height: auto;
      margin: 0 auto 26px;
      border-radius: 2px;
    }

    .intro {
      margin: 0 auto;
      max-width: 650px;
    }

    section {
      padding: 34px 0;
      border-top: 1px solid var(--line);
    }

    .logo {
      display: block;
      width: min(100%, 430px);
      height: auto;
      margin: 0 auto 28px;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 30px;
      border-radius: 2px;
    }

    /* Sombra de texto para garantizar lectura sobre la foto de fondo */
    h1, h2, h3, p, li, span, a, div {
      font-family: 'Metal Mania', cursive, sans-serif !important;
      text-shadow: 2px 2px 4px #000000, 0px 0px 8px #000000;
    }

    h1, h2 {
      text-align: center;
      margin: 0 0 20px;
      line-height: 1.2;
      letter-spacing: .05em;
    }

    h1 {
      font-size: clamp(27px, 5vw, 42px);
      text-transform: uppercase;
    }

    h2 {
      font-size: clamp(23px, 4vw, 32px);
    }

    p { margin: 0 0 18px; }

    .events {
      margin: 20px 0 22px;
      padding-left: 24px;
    }

    .events li { margin: 9px 0; }

    .people {
      display: grid;
      gap: 7px;
      text-align: center;
      margin-top: 24px;
      letter-spacing: .03em;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 30px;
      text-align: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
